[project]
name = "attention-benchmark"
version = "0.1.0"
description = "Benchmarking attention implementations in JAX/Flax"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "flax",
    "optax",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
train = [
    "transformers",
    "datasets",
    "orbax-checkpoint",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
